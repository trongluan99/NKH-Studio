plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    compileSdk 36

    defaultConfig {
        minSdkVersion 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    namespace 'com.ads.nkh'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-runtime:2.10.0"

    // Admob (GMA Next-Gen SDK)
    api 'androidx.multidex:multidex:2.0.1'
    api 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.5.0'

    implementation "com.android.billingclient:billing:9.0.0"
    implementation "com.google.guava:guava:33.6.0-android"

    implementation 'com.google.firebase:firebase-analytics:23.2.0'

    // Mediation (GMA Next-Gen SDK bundles com.google.android.gms.ads.mediation.* compatibility classes;
    // exclude legacy play-services-ads transitive artifacts to prevent duplicate class errors)
    implementation('com.google.ads.mediation:facebook:6.22.0.1') {
        exclude group: 'com.google.android.gms', module: 'play-services-ads'
        exclude group: 'com.google.android.gms', module: 'play-services-ads-api'
        exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
    }
    implementation('com.google.ads.mediation:applovin:13.6.4.2') {
        exclude group: 'com.google.android.gms', module: 'play-services-ads'
        exclude group: 'com.google.android.gms', module: 'play-services-ads-api'
        exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
    }
    implementation('com.google.ads.mediation:vungle:7.7.8.1') {
        exclude group: 'com.google.android.gms', module: 'play-services-ads'
        exclude group: 'com.google.android.gms', module: 'play-services-ads-api'
        exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
    }
    implementation('com.google.ads.mediation:pangle:8.3.0.4.0') {
        exclude group: 'com.google.android.gms', module: 'play-services-ads'
        exclude group: 'com.google.android.gms', module: 'play-services-ads-api'
        exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
    }
    implementation('com.google.ads.mediation:mintegral:17.1.81.1') {
        exclude group: 'com.google.android.gms', module: 'play-services-ads'
        exclude group: 'com.google.android.gms', module: 'play-services-ads-api'
        exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
    }
    implementation 'com.unity3d.ads:unity-ads:4.21.0'
    implementation('com.google.ads.mediation:unity:4.21.0.0') {
        exclude group: 'com.google.android.gms', module: 'play-services-ads'
        exclude group: 'com.google.android.gms', module: 'play-services-ads-api'
        exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
    }
    implementation('com.google.ads.mediation:ironsource:9.6.1.0') {
        exclude group: 'com.google.android.gms', module: 'play-services-ads'
        exclude group: 'com.google.android.gms', module: 'play-services-ads-api'
        exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
    }

    // Facebook SDK
    implementation 'com.facebook.android:facebook-android-sdk:18.3.0'

    // Adjust
    implementation 'com.adjust.sdk:adjust-android:5.8.0'
    implementation 'com.android.installreferrer:installreferrer:2.2'

    // Lottie
    implementation 'com.airbnb.android:lottie:6.7.1'

    // Sdp & Ssp
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.intuit.ssp:ssp-android:1.1.1'

    testImplementation 'junit:junit:4.13.2'
}

afterEvaluate {
    publishing {
        publications {
            create("release", MavenPublication) {
                from(components["release"])
                groupId = "com.github.trongluan99"
                artifactId = "NKH-Studio"
                version = "1.0.0"
            }
        }
    }
}
